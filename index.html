<!DOCTYPE html>
<script>
    if (localStorage.getItem("loggedIn") !== "true") {
        window.location.href = "login.html";
    }
</script>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Complaint AI</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<button onclick="logout()" class="logout-btn">Logout</button>
    <div class="page">
        <header class="hero">
            <div>
                <span class="eyebrow">AI CUSTOMER SUPPORT</span>
                <h1>Smart Complaint Classifier</h1>
                <p>Submit a complaint and get an AI-based category, priority and department recommendation.</p>
            </div>
            <div class="ai-badge">AI</div>
        </header>

        <main class="card">
            <form id="complaintForm">
                <section>
                    <h2>Customer Details</h2>
                    <div class="grid">
                        <label>
                            Gender
                            <select id="gender" required>
                                <option value="">Select gender</option>
                                <option>Male</option>
                                <option>Female</option>
                                <option>Other</option>
                            </select>
                        </label>

                        <label>
                            Age
                            <input id="age" type="number" min="1" max="120" placeholder="Enter age" required>
                        </label>

                        <label>
                            Product Category
                            <select id="product_category" required>
                                <option value="">Select category</option>
                                <option>Electronics</option>
                                <option>Home Appliances</option>
                                <option>Mobile</option>
                                <option>Computer</option>
                                <option>Furniture</option>
                                <option>Clothing</option>
                                <option>Other</option>
                            </select>
                        </label>
                    </div>
                </section>

                <section>
                    <h2>Complaint</h2>
                    <label>
                        Complaint Description
                        <textarea id="complaint_text" rows="6"
                            placeholder="Example: My phone battery drains very quickly and the device becomes hot..."
                            maxlength="1000" required></textarea>
                    </label>
                    <div class="counter"><span id="count">0</span>/1000</div>
                </section>

                <button id="submitBtn" type="submit">
                    <span id="buttonText">Analyze Complaint</span>
                    <span id="loader" class="loader hidden"></span>
                </button>

                <p id="error" class="error hidden"></p>
            </form>

            <section id="result" class="result hidden">
                <div class="result-head">
                    <div>
                        <span class="eyebrow">AI ANALYSIS</span>
                        <h2>Prediction Result</h2>
                    </div>
                    <span id="priorityBadge" class="priority">-</span>
                </div>

                <div class="result-grid">
                    <div class="result-box">
                        <span>Complaint Category</span>
                        <strong id="category">-</strong>
                    </div>
                    <div class="result-box">
                        <span>Priority</span>
                        <strong id="priority">-</strong>
                    </div>
                    <div class="result-box">
                        <span>Recommended Department</span>
                        <strong id="department">-</strong>
                    </div>
                    <div class="result-box">
                        <span>Suggested Response</span>
                        <strong id="response">-</strong>
                    </div>
                </div>

                <button class="secondary" type="button" id="newComplaint">Analyze Another Complaint</button>
            </section>
        </main>
    </div>
    <script src="script.js"></script>
<script>
    function logout() {
        window.location.href = "login.html";
    }
</script>
</body>
</html>
